<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <rect width="600" height="375" fill="#0d1415"/>
  <rect x="15" y="15" width="570" height="345" fill="none" stroke="rgba(155,211,63,0.15)" stroke-width="1" rx="6"/>
  <!-- CNC Machined Cylinder & Flange -->
  <g transform="translate(150, 60)">
    <rect x="40" y="40" width="220" height="180" fill="#6e7f7c" rx="12" stroke="#d4e2df" stroke-width="2"/>
    <circle cx="150" cy="130" r="60" fill="#121a1b" stroke="#9bd33f" stroke-width="3"/>
    <circle cx="150" cy="130" r="30" fill="#1e2c2e" stroke="#6e7f7c" stroke-width="2"/>
    <!-- Chamfer lines -->
    <line x1="40" y1="40" x2="70" y2="70" stroke="#a4b8b4" stroke-width="2"/>
    <line x1="260" y1="40" x2="230" y2="70" stroke="#a4b8b4" stroke-width="2"/>
  </g>
  <text x="30" y="340" fill="#9bd33f" font-family="monospace" font-size="13">PRECISION CNC PARTS — ±0.005mm</text>
</svg>
