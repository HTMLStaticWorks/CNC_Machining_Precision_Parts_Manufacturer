<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1112"/>
      <stop offset="100%" stop-color="#162224"/>
    </linearGradient>
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6e7f7c"/>
      <stop offset="50%" stop-color="#a4b8b4"/>
      <stop offset="100%" stop-color="#4a5a57"/>
    </linearGradient>
    <linearGradient id="probe-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9bd33f"/>
      <stop offset="100%" stop-color="#558012"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background & Blueprint Grid -->
  <rect width="800" height="500" fill="url(#bg-grad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="rgba(155,211,63,0.2)" stroke-width="1" rx="8"/>
  
  <!-- CMM Machine Bridge -->
  <rect x="140" y="50" width="520" height="30" fill="#1f2c2e" stroke="#36494c" stroke-width="2" rx="4"/>
  <rect x="380" y="80" width="40" height="140" fill="#2a3a3d" stroke="#486064" stroke-width="2"/>
  
  <!-- CMM Sapphire Touch Probe Shaft -->
  <line x1="400" y1="220" x2="400" y2="310" stroke="#c0d0cc" stroke-width="4"/>
  <circle cx="400" cy="315" r="7" fill="#ff4d4d"/> <!-- Ruby stylus tip -->

  <!-- Precision Machined Component -->
  <path d="M 260 360 L 320 280 L 480 280 L 540 360 L 540 430 L 260 430 Z" fill="url(#metal-grad)" stroke="#d4e2df" stroke-width="2"/>
  <circle cx="400" cy="355" r="45" fill="#121a1b" stroke="#9bd33f" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="400" cy="355" r="25" fill="#1a2527" stroke="#6e7f7c" stroke-width="2"/>

  <!-- Laser Measurement Beams & Crosshairs -->
  <line x1="400" y1="315" x2="400" y2="440" stroke="#9bd33f" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="220" y1="315" x2="580" y2="315" stroke="#9bd33f" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Dimension Telemetry HUD -->
  <rect x="50" y="60" width="220" height="110" fill="rgba(11,17,18,0.85)" stroke="#9bd33f" stroke-width="1" rx="6"/>
  <text x="65" y="85" fill="#9bd33f" font-family="monospace" font-size="13" font-weight="bold">CMM TELEMETRY : VERIFIED</text>
  <text x="65" y="110" fill="#ffffff" font-family="sans-serif" font-size="12">Coaxiality: ±0.002 mm</text>
  <text x="65" y="130" fill="#ffffff" font-family="sans-serif" font-size="12">Bore Diameter: 50.004 mm</text>
  <text x="65" y="150" fill="#a4b8b4" font-family="sans-serif" font-size="11">Status: PASS 100%</text>

  <!-- Probe Vector Angle Badge -->
  <rect x="560" y="380" x2="740" width="180" height="60" fill="rgba(11,17,18,0.85)" stroke="#36494c" stroke-width="1" rx="6"/>
  <text x="575" y="405" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Zeiss CMM Inspection</text>
  <text x="575" y="425" fill="#9bd33f" font-family="monospace" font-size="11">Sampling: 1,024 pts</text>
</svg>
