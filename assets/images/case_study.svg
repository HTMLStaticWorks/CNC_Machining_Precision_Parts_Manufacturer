<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1415"/>
      <stop offset="100%" stop-color="#182527"/>
    </linearGradient>
    <linearGradient id="metal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e9490"/>
      <stop offset="40%" stop-color="#cfdedb"/>
      <stop offset="100%" stop-color="#41524f"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)"/>
  <rect width="800" height="500" fill="url(#grid2)"/>

  <!-- Actuator Housing 3D Render -->
  <g transform="translate(180, 80)">
    <!-- Main Outer Body -->
    <rect x="60" y="60" width="320" height="240" fill="url(#metal2)" rx="24" stroke="#e0ecea" stroke-width="2"/>
    <!-- Mounting Flange Holes -->
    <circle cx="100" cy="100" r="16" fill="#111819" stroke="#9bd33f" stroke-width="2"/>
    <circle cx="340" cy="100" r="16" fill="#111819" stroke="#9bd33f" stroke-width="2"/>
    <circle cx="100" cy="260" r="16" fill="#111819" stroke="#9bd33f" stroke-width="2"/>
    <circle cx="340" cy="260" r="16" fill="#111819" stroke="#9bd33f" stroke-width="2"/>
    
    <!-- Central Bearing Pocket Bore -->
    <circle cx="220" cy="180" r="70" fill="#0d1415" stroke="#9bd33f" stroke-width="3"/>
    <circle cx="220" cy="180" r="48" fill="#1b2729" stroke="#7e9490" stroke-width="2"/>
    
    <!-- Dimension Callout Lines -->
    <line x1="60" y1="30" x2="380" y2="30" stroke="#9bd33f" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="60" y1="20" x2="60" y2="40" stroke="#9bd33f" stroke-width="1.5"/>
    <line x1="380" y1="20" x2="380" y2="40" stroke="#9bd33f" stroke-width="1.5"/>
    <text x="220" y="25" fill="#9bd33f" font-family="monospace" font-size="12" text-anchor="middle">320.00 mm (±0.005mm)</text>
  </g>

  <!-- Spec Badges -->
  <rect x="40" y="40" width="200" height="40" fill="#192425" stroke="#36494c" stroke-width="1" rx="4"/>
  <text x="55" y="65" fill="#9bd33f" font-family="sans-serif" font-size="12" font-weight="bold">5-AXIS AEROSPACE BATCH</text>

  <rect x="560" y="380" width="200" height="60" fill="rgba(11,17,18,0.9)" stroke="#9bd33f" stroke-width="1" rx="6"/>
  <text x="575" y="405" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">SERVO HOUSING #450</text>
  <text x="575" y="425" fill="#9bd33f" font-family="monospace" font-size="11">CMM CERTIFIED 99.8%</text>
</svg>
