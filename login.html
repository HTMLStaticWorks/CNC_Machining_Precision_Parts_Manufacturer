<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Client Login — Forgea</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-body">
  <div class="auth-header">
    <div class="auth-actions">
      <button class="rtl-toggle" type="button" aria-label="Toggle RTL mode" title="Toggle RTL layout alignment">RTL</button>
      <button class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle light/dark theme">☾</button>
    </div>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo-center">
        <a class="brand" href="index.html" title="Back to main website"><i aria-label="Forgea logo"></i></a>
      </div>
      <div class="eyebrow">CLIENT PORTAL</div>
      <h1>Welcome back.</h1>
      <p>Access orders, quotes, production status and quality documents.</p>

      <div class="social-auth-buttons">
        <button type="button" class="btn-social btn-google" onclick="alert('Google sign-in demo connected.')">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.616z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
          <span>Google</span>
        </button>
        <button type="button" class="btn-social btn-apple" onclick="alert('Apple sign-in demo connected.')">
          <svg width="18" height="18" viewBox="0 0 170 170" fill="currentColor"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.82.13-9.68-1.92-14.58-6.14-3.32-2.88-7.23-7.64-11.72-14.28-6.02-8.89-10.84-18.77-14.47-29.65-3.63-10.88-5.45-21.36-5.45-31.43 0-14.58 3.69-26.68 11.07-36.31 7.38-9.63 16.74-14.53 28.08-14.7 4.82 0 9.87 1.15 15.16 3.44 5.29 2.29 9.17 3.44 11.64 3.44 2.12 0 6.03-1.18 11.73-3.55 5.7-2.37 10.63-3.48 14.79-3.33 10.98.44 19.82 4.41 26.52 11.93-9.66 5.86-14.39 14.07-14.2 24.63.19 10.74 4.54 19.34 13.06 25.8 4.02 3.09 8.52 5.34 13.5 6.75-2.69 7.82-6.26 15.63-10.71 23.43zM119.22 31.81c0-6.75 2.44-13.31 7.32-19.68 4.88-6.37 10.94-10.3 18.18-11.8 1.07 7.15-1.12 14.15-6.57 21-4.7 5.92-10.72 9.77-18.06 11.55-.26-.35-.87-1.07-8.87-1.07z"/></svg>
          <span>Apple</span>
        </button>
      </div>

      <div class="auth-divider"><span>or sign in with email</span></div>

      <form id="loginForm">
        <label>Work Email
          <input type="email" required placeholder="you@company.com">
        </label>
        
        <label>Password
          <div class="password-field">
            <input type="password" id="loginPassword" required placeholder="••••••••">
            <button type="button" class="btn-toggle-pw" title="Show password" onclick="togglePasswordVisibility('loginPassword', this)">👁</button>
          </div>
        </label>

        <div class="form-between">
          <label class="check"><input type="checkbox"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button class="btn btn-primary full" type="submit">Sign In ↗</button>
        <small id="loginMessage"></small>
      </form>

      <div class="auth-switch">New client? <a href="signup.html">Create an account</a></div>

      <!-- NEW SECTION: Enterprise Security & NDA Seals -->
      <div class="security-seal-bar">
        <div class="security-item">
          <span>🔒 256-Bit Encrypted CAD Storage</span>
        </div>
        <div class="security-item">
          <span>🛡️ Automatic NDA Protection</span>
        </div>
        <div class="security-item">
          <span>✓ ISO 27001 Ready</span>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
